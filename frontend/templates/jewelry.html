{% extends "base.html" %}
{% block title %}Jewelry Planner{% endblock %}
{% block content %}
<div class="form-card">
<h1>💎 Jewelry Planner</h1>
<p class="muted">Get style suggestions based on your occasion and budget.</p>
<form class="planner-form" data-endpoint="/generate-jewelry">
    <label>Budget (₹)<input type="number" name="budget" min="1" required placeholder="5000"></label>
    <label>Occasion<input type="text" name="occasion" required placeholder="Wedding"></label>
    <label>Style
        <select name="style">
            <option>Traditional</option>
            <option>Modern</option>
            <option>Minimal</option>
            <option>Fusion</option>
        </select>
    </label>
    <button class="button" type="submit">Generate Plan</button>
</form>
<div id="result" class="result hidden"></div>
</div>
{% endblock %}
